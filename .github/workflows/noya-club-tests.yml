name: NOYA Club checks
on:
  push:
    branches: [feature/club-diagnostic-prototype]
  pull_request:
    paths:
      - 'api/club-diagnostic.js'
      - 'tests/**'
      - 'club.html'
      - 'club-demo.html'
      - '.github/workflows/noya-club-tests.yml'
permissions:
  contents: read
jobs:
  club-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check API syntax
        run: |
          node --check api/club-diagnostic.js
          node --check api/club-video-token.js
          node --check api/club-lessons.js
          node --check api/club-progress.js
          node --check lib/club-reward-pdf.js
          node --check lib/club-checkout.js
          node --check lib/club-prodamus-webhook.js
          node --check lib/noya-prodamus.js
      - name: Run API tests
        run: node --test tests/*.test.js
      - name: Check embedded page scripts
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          for(const file of ['club.html','club-demo.html']){
            const html=fs.readFileSync(file,'utf8');
            const matches=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
            if(!matches.length)throw new Error('No inline script in '+file);
            for(const [,source] of matches)new vm.Script(source,{filename:file});
            console.log('Syntax OK:',file);
          }
          NODE
