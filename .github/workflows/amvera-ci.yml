name: NOYA Amvera migration checks
on:
  push:
    branches: [feature/amvera-migration]
  pull_request:
    paths:
      - server.cjs
      - amvera.yml
      - package.json
      - api/**
      - lib/**
      - tests/amvera-server.test.cjs
      - tests/club-renewal-reward.sql
      - supabase/migrations/**
permissions:
  contents: read
jobs:
  renewal-rewards:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify payment and wallet transactions
        run: psql postgresql://postgres:postgres@localhost/postgres -f tests/club-renewal-reward.sql
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate server and handler syntax
        run: |
          node --check server.cjs
          node --check lib/course-drip.cjs
          for f in api/*.js lib/*.js; do node --check "$f"; done
      - name: Test Amvera HTTP adapter
        run: node --test tests/amvera-server.test.cjs
      - name: Test course daily scheduling and sequential release
        run: node --test tests/course-daily-unlock.test.cjs tests/course-lock-api.test.cjs
      - name: Run existing NOYA regression tests
        run: node --test tests/*.test.js
