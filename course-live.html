<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Прямые эфиры — NOYA CLUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--accent:#f5fa45;--text:#f6f6f6;--bg:#050505}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit}
main{width:min(100%,620px);margin:0 auto;padding:18px 15px calc(75px + env(safe-area-inset-bottom))}
.back{display:inline-flex;align-items:center;gap:7px;border:1px solid #434343;background:#171717;border-radius:23px;color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:9px 14px;margin-bottom:23px}
.back:focus-visible,.heart:focus-visible,.cover:focus-visible,.watched-action:focus-visible,.dialog-close:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 19px}
h1{font:700 clamp(26px,6.9vw,40px)/1.05 Oswald,Impact,"Arial Narrow",sans-serif;letter-spacing:-.5px;text-transform:uppercase;margin:0;max-width:66%}
.count{display:flex;align-items:center;gap:8px;color:var(--accent);white-space:nowrap;font:600 clamp(23px,6.3vw,38px)/1 Oswald,Impact,sans-serif;letter-spacing:-.5px}
.count-check{font:400 .7em/1 system-ui,sans-serif}
.searchbar{display:flex;align-items:center;gap:11px;background:#191919;border-radius:32px;padding:0 18px;min-height:47px;margin-bottom:13px;border:1px solid #1d1d1d}
.searchbar svg{flex:0 0 20px;opacity:.55}
.searchbar input{flex:1;min-width:0;border:0;background:none;color:#f6f6f6;outline:none;padding:14px 0;font-size:14px}
.searchbar input::placeholder{color:#8d8d8d}
.library-status{margin:8px 0 14px;color:#a0a0a0;font-size:12px;min-height:0}
.card{background:#e6e6e6;color:#111;border-radius:17px;padding:17px 17px 15px;margin:0 0 14px;overflow:hidden}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 15px}
.card h2{font:750 14px/1.36 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.favorite-wrap{display:flex;gap:9px;align-items:center;flex-shrink:0}
.favorite-note{color:#6e6e6e;font-size:10px;line-height:1.2;text-align:right;max-width:72px}
.heart{display:grid;place-items:center;width:39px;height:39px;background:#1b1b1b;color:var(--accent);border:0;border-radius:50%;padding:0;font-size:25px;line-height:1;flex-shrink:0}
.heart[aria-pressed=true]{background:#111}
.cover{display:block;position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;border:0;border-radius:12px;padding:0;text-align:center;color:var(--accent);background:linear-gradient(135deg,#252525 0%,#111 60%,#080808 100%)}
.cover img{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-placeholder{display:grid;place-items:center;height:100%;font:700 clamp(21px,5vw,32px)/1.1 Oswald,sans-serif;padding:20px}
.cover-play{position:absolute;left:12px;bottom:12px;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#f5fa45;color:#101010;font-size:20px;box-shadow:0 3px 18px #0009}
.watched-tag{display:inline-flex;align-items:center;gap:4px;margin-top:10px;color:#3b4d0c;font-size:11px;font-weight:900;letter-spacing:.3px}
.empty{margin-top:12px;border:1px dashed #444;background:#171717;border-radius:15px;padding:25px 17px;text-align:center;color:#aaa}
.muted{margin:20px 0 0;font-size:12px;color:#999}
dialog{width:min(95vw,650px);max-height:min(90dvh,900px);overflow:auto;padding:19px;background:#151515;color:#fff;border:1px solid #444;border-radius:20px;box-shadow:0 20px 80px #000b}
dialog::backdrop{background:#000d}
dialog h2{font:600 25px/1.12 Oswald,sans-serif;margin:4px 0 17px}
dialog iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#050505}
.dialog-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.dialog-close,.watched-action{border:0;border-radius:11px;padding:11px 15px;font-size:13px;font-weight:750}
.dialog-close{background:#333;color:#fff}
.watched-action{background:#f5fa45;color:#111}
.watched-action:disabled{opacity:.65}
@media(max-width:350px){main{padding-left:12px;padding-right:12px}.card{padding:13px}.favorite-note{display:none}.heading{gap:6px}h1{font-size:25px}.count{font-size:24px}}
</style>
</head>
<body>
<main>
 <a class="back noya-legacy-return" href="./club.html#home">← Главная клуба</a>
 <div class="heading"><h1>ПРЯМЫЕ ЭФИРЫ</h1><div class="count" id="live-count" aria-live="polite"><span class="count-check">✓</span><span id="live-numbers">— ИЗ —</span></div></div>
 <label class="searchbar" for="search">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.5" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.3 16.3 5 5"/></svg>
  <input type="search" id="search" placeholder="Поиск..." autocomplete="off" aria-label="Поиск по эфирам">
 </label>
 <div id="status" class="library-status" aria-live="polite"></div>
 <div id="list"><div class="empty">Загружаем записи…</div></div>
 
</main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="./assets/noya-navigation.js?v=1"></script><script src="./assets/noya-video-actions.js?v=2"></script>
<script>
"use strict";
let streams=[],favorites=new Set(),watched=new Set(),loading=false,activeDialog=null,playerSdkPromise=null;
let deepLinkId=new URLSearchParams(location.search).get('open')||null;
const list=document.getElementById('list'),search=document.getElementById('search');
const counter=document.getElementById('live-numbers'),statusEl=document.getElementById('status');
window.Telegram?.WebApp?.ready();
function api(action,extra){
 const initData=window.Telegram?.WebApp?.initData;
 if(!initData) return Promise.reject(new Error('Открой библиотеку через Telegram-бота NOYA CLUB'));
 return fetch('/api/stream-token',{
  method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(Object.assign({action,initData},extra||{}))
 }).then(async r=>{
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error||'Ошибка загрузки ('+r.status+')');
  return data;
 });
}
function updateCounter(){
 const valid=new Set(streams.map(s=>s.id));
 let count=0;
 for(const id of watched)if(valid.has(id))count++;
 counter.textContent=count+' ИЗ '+streams.length;
}
function render(){
 updateCounter();
 const q=search.value.trim().toLocaleLowerCase('ru');
 const found=streams.filter(s=>s.title.toLocaleLowerCase('ru').includes(q));
 list.replaceChildren();
 if(!found.length){
  const empty=document.createElement('div');
  empty.className='empty';
  empty.textContent=q?'По запросу ничего не найдено':'Опубликованных эфиров пока нет.';
  list.append(empty);return;
 }
 const fragment=document.createDocumentFragment();
 for(const s of found){
  const card=document.createElement('article');card.className='card';
  const head=document.createElement('div');head.className='card-top';
  const title=document.createElement('h2');title.textContent=s.title;
  head.append(title);card.append(head);
  const cover=document.createElement('button');cover.className='cover';cover.type='button';cover.setAttribute('aria-label','Смотреть: '+s.title);
  if(s.cover_url&&/^https:\/\//.test(s.cover_url)){
   const img=document.createElement('img');img.src=s.cover_url;img.alt='Обложка: '+s.title;img.loading='lazy';img.decoding='async';
   cover.append(img);
  }else{
   const placeholder=document.createElement('span');placeholder.className='cover-placeholder';placeholder.textContent='ПРЯМЫЕ ЭФИРЫ';cover.append(placeholder);
  }
  const play=document.createElement('span');play.className='cover-play';play.textContent='▶';play.setAttribute('aria-hidden','true');cover.append(play);
  cover.onclick=()=>watch(s);card.append(cover);
  if(window.NOYAMaterials){
   const widget=window.NOYAMaterials.controls('live',s.id,{onChanged(action,state){
    if(action==='favorite'){if(state.favorited)favorites.add(s.id);else favorites.delete(s.id);}
    if(action==='complete'){if(state.completed)watched.add(s.id);else watched.delete(s.id);updateCounter();}
    render();
   }});
   card.append(widget.element);
  }
  fragment.append(card);
 }
 list.append(fragment);
}
async function reload(){
 if(loading||document.hidden)return;
 loading=true;
 try{
  const data=await api('live_list');
  streams=Array.isArray(data.streams)?data.streams:[];
  favorites=new Set(data.favorites||[]);
  watched=new Set(data.watched||[]);
  statusEl.textContent='';
  render();
  if(deepLinkId){
   const record=streams.find(x=>x.id===deepLinkId);
   deepLinkId=null;
   if(record)watch(record);
  }
 }catch(error){
  statusEl.textContent=error.message;
  if(!streams.length){list.replaceChildren();const empty=document.createElement('div');empty.className='empty';empty.textContent='Не удалось загрузить записи.';list.append(empty);}
 }finally{loading=false;}
}
async function markWatched(s,button){
 if(watched.has(s.id))return;
 if(button){button.disabled=true;button.textContent='Сохраняем…';}
 try{
  await api('live_mark_watched',{streamId:s.id});
  watched.add(s.id);
  render();
  if(button)button.textContent='✓ Просмотрено';
 }catch(error){
  statusEl.textContent='Не удалось сохранить просмотр: '+error.message;
  if(button){button.disabled=false;button.textContent='✓ Отметить просмотренным';}
 }
}
function ensurePlayerSdk(){
 if(typeof window.Stream==='function')return Promise.resolve();
 if(!playerSdkPromise){
  playerSdkPromise=new Promise((resolve,reject)=>{
   const script=document.createElement('script');
   script.src='https://embed.cloudflarestream.com/embed/sdk.latest.js';
   script.onload=()=>typeof window.Stream==='function'?resolve():reject(new Error('Плеер недоступен'));
   script.onerror=()=>reject(new Error('Не удалось загрузить плеер'));
   document.head.append(script);
  });
 }
 return playerSdkPromise;
}
async function watch(s){
 if(activeDialog)return;
 try{
  statusEl.textContent='';
  const data=await api('live_watch',{streamId:s.id});
  const dialog=document.createElement('dialog');activeDialog=dialog;
  const heading=document.createElement('h2');heading.textContent=s.title;dialog.append(heading);
  const iframe=document.createElement('iframe');iframe.title=s.title;
  iframe.src='https://customer-9y0wom20nneqpu4g.cloudflarestream.com/'+encodeURIComponent(data.token)+'/iframe';
  iframe.allow='accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture';
  iframe.allowFullscreen=true;dialog.append(iframe);
  const actions=document.createElement('div');actions.className='dialog-actions';
  let dialogWidget=null;
  if(window.NOYAMaterials){
   dialogWidget=window.NOYAMaterials.controls('live',s.id,{onChanged(action,state){
    if(action==='favorite'){if(state.favorited)favorites.add(s.id);else favorites.delete(s.id);}
    if(action==='complete'){if(state.completed)watched.add(s.id);else watched.delete(s.id);}
    render();
   }});
   dialog.append(dialogWidget.element);
  }
  const close=document.createElement('button');close.className='dialog-close noya-legacy-return';close.type='button';close.textContent='Закрыть';close.onclick=()=>dialog.close();
  actions.append(close);dialog.append(actions);
  dialog.addEventListener('close',()=>{iframe.src='about:blank';dialog.remove();activeDialog=null;},{once:true});
  document.body.append(dialog);dialog.showModal();
  if(window.NOYAMaterials)window.NOYAMaterials.touch('live',s.id).catch(error=>console.warn('Live history unavailable:',error.message));
  // Cloudflare Stream fires playback events from its iframe API. Mark as watched
  // near the end of playback, not when a person merely opens a recording.
  ensurePlayerSdk().then(()=>{
   if(!dialog.open)return;
   const player=window.Stream(iframe);
   let autoSaved=false;
   const finish=async()=>{
    if(autoSaved||watched.has(s.id))return;
    autoSaved=true;
    await markWatched(s,null);
    if(dialogWidget&&watched.has(s.id))dialogWidget.refresh().catch(()=>{});
   };
   player.addEventListener('ended',finish);
   player.addEventListener('timeupdate',()=>{
    const duration=Number(player.duration),position=Number(player.currentTime);
    if(Number.isFinite(duration)&&duration>0&&Number.isFinite(position)&&position/duration>=0.9)finish();
   });
  }).catch(error=>{console.warn('Automatic playback tracking unavailable:',error.message);});
 }catch(error){statusEl.textContent=error.message;}
}
search.addEventListener('input',render);
window.addEventListener('pageshow',()=>reload());
window.addEventListener('focus',()=>{if(!activeDialog)reload();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!activeDialog)reload();});
reload();
</script>
</body>
</html>
