<script>

let courseBackAction=null;
function setCourseBack(action,title=''){
 courseBackAction=action;
 const nav=document.getElementById('course-back-nav');
 if(!nav)return;
 nav.hidden=!action;
 const label=document.getElementById('course-nav-title');
 if(label)label.textContent=title;
}
function courseGoBack(){
 if(typeof courseBackAction==='function')courseBackAction();
 else loadCourse();
}
let activeCourseWatch=null;
function setupAutomaticLessonCompletion(lessonId,alreadyDone){
 if(activeCourseWatch){activeCourseWatch.cancelled=true;activeCourseWatch=null}
 const iframe=document.getElementById('course-video-player');
 const status=document.getElementById('course-watch-status');
 if(!iframe||alreadyDone){if(status&&alreadyDone)status.textContent='✓ Урок уже пройден';return}
 if(typeof window.Stream!=='function'){if(status)status.textContent='Автоматическое отслеживание недоступно. Можно отметить урок вручную.';return}
 const watch={cancelled:false,lastTime:null,watched:0,saving:false,completed:false};
 activeCourseWatch=watch;
 try{
  const player=window.Stream(iframe);
  const update=async()=>{
   if(watch.cancelled||watch.saving||watch.completed)return;
   const duration=Number(player.duration),current=Number(player.currentTime);
   if(!Number.isFinite(duration)||duration<=0||!Number.isFinite(current))return;
   if(watch.lastTime!==null){
    const delta=current-watch.lastTime;
    if(delta>0&&delta<=2.5)watch.watched+=delta;
   }
   watch.lastTime=current;
   const percent=Math.min(100,Math.floor(100*watch.watched/duration));
   if(status)status.textContent='Просмотрено: '+percent+'% из 90% для завершения урока';
   if(watch.watched<duration*.9)return;
   watch.saving=true;
   if(status)status.textContent='Сохраняем прохождение урока…';
   try{
    await courseProgressRequest('course_complete',{lessonId,completed:true});
    if(watch.cancelled)return;
    watch.completed=true;
    if(!courseProgress.completed.includes(lessonId))courseProgress.completed.push(lessonId);
    if(status)status.textContent='✓ Урок просмотрен и отмечен пройденным';
    const button=document.getElementById('course-manual-complete');
    if(button)button.textContent='Урок завершён ✓';
   }catch(e){watch.saving=false;if(status)status.textContent='Не удалось сохранить просмотр: '+e.message}
  };
  player.addEventListener('timeupdate',update);
  player.addEventListener('seeking',()=>{watch.lastTime=null});
  player.addEventListener('pause',()=>{watch.lastTime=null});
  player.addEventListener('ended',update);
  if(status)status.textContent='Просмотри 90% видео — урок завершится автоматически';
 }catch(e){if(status)status.textContent='Автоматическое отслеживание недоступно. Можно отметить урок вручную.'}
}
let courseProgress={blocks:[],lessons:[],completed:[]};
async function courseProgressRequest(action,extra={}){
 const initData=window.Telegram?.WebApp?.initData;
 if(!initData)throw Error('Открой курс через Telegram');
 const r=await fetch('/api/stream-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,initData,...extra})});
 const data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка прогресса');return data;
}
async function markCourseLesson(id,completed,blockId,title){
 try{await courseProgressRequest('course_complete',{lessonId:id,completed});await loadLesson(id,blockId,title)}
 catch(e){alert(e.message)}
}
async function continueCourse(){
 try{
  let blocks=courseProgress.blocks,lessons=courseProgress.lessons;
  if(!lessons.length){
   const catalog=await courseProgressRequest('course_catalog');
   lessons=catalog.lessons||[];
   if(!blocks.length)blocks=catalog.blocks||[];
  }
  const order=new Map(blocks.map(b=>[b.id,b.block_number])),allowed=new Set(blocks.map(b=>b.id)),done=new Set(courseProgress.completed);
  const next=[...lessons].filter(l=>l.is_published&&allowed.has(l.block_id)&&!done.has(l.id)).sort((a,b)=>(order.get(a.block_id)-order.get(b.block_id))||(a.day_number-b.day_number))[0];
  if(!next){alert('Нет доступных незавершённых уроков. Проверь раздел «Предобучение».');return}
  const block=blocks.find(b=>b.id===next.block_id);
  await loadLesson(next.id,next.block_id,block?.title||'Урок');
 }catch(e){alert('Ошибка открытия урока: '+e.message)}
}
let currentUser = null;

window.isAdmin = false;


// ==================================================
// TELEGRAM АВТОРИЗАЦИЯ
// ==================================================

async function authenticateTelegram() {

  const app =
    document.getElementById("app");

  try {

    if (
      !window.Telegram ||
      !window.Telegram.WebApp
    ) {

      throw new Error(
        "Приложение нужно открыть внутри Telegram."
      );

    }


    const tg =
      window.Telegram.WebApp;


    tg.ready();
    tg.expand();


    const initData =
      tg.initData;


    if (!initData) {

      throw new Error(
        "Telegram не передал данные пользователя."
      );

    }


    const response =
      await fetch(
        "/api/telegram-auth",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            initData: initData
          })
        }
      );


    if (!response.ok) {

      const errorData =
        await response
          .json()
          .catch(() => ({}));


      console.error(
        "AUTH ERROR:",
        errorData
      );


      throw new Error(
        errorData.details
          ? JSON.stringify(
              errorData.details
            )
          : (
              errorData.error ||
              "Telegram не удалось подтвердить."
            )
      );

    }


    const data =
      await response.json();


    if (
      !data.ok ||
      !data.user
    ) {

      throw new Error(
        "Пользователь не подтверждён."
      );

    }


    currentUser =
      data.user;


    window.isAdmin =
      Boolean(
        data.admin &&
        data.admin.isAdmin
      );


    return data;


  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="card">

        <div class="error">

          ${escapeHtml(
            error.message
          )}

        </div>

      </div>

    `;


    return null;

  }

}

// ГЛАВНЫЙ ЭКРАН КУРСА
// ==================================================

async function loadCourse() {
  setCourseBack(null);

  const app =
    document.getElementById("app");


  app.innerHTML = `

    <div class="status">
      Загружаем курс...
    </div>

  `;


  try {


    // ----------------------------------------------
    // БЛОКИ
    // ----------------------------------------------

    const catalog=await courseProgressRequest('course_catalog');
    const blocks=catalog.blocks||[];
    try{courseProgress=await courseProgressRequest('course_progress')}
    catch(e){console.warn('Course progress not available:',e.message);courseProgress={blocks:[],lessons:[],completed:[],error:e.message}}



    // ----------------------------------------------
    // НОВОСТИ
    // ----------------------------------------------

    let html = "";


    const done=new Set(courseProgress.completed);
    const total=courseProgress.lessons.length||26;
    const profileName=[currentUser?.first_name,currentUser?.last_name].filter(Boolean).join(' ')||currentUser?.username||'Участник курса';
    const profilePhoto=currentUser?.photo_url&&/^https:\/\//.test(currentUser.photo_url)?currentUser.photo_url:'';
    html += `
      <div class="course-profile">
        <div class="course-avatar">${profilePhoto?'<img src="'+escapeHtml(profilePhoto)+'" alt="">':'🐕'}</div>
        <div class="course-profile-copy"><strong>${escapeHtml(profileName)}</strong><span>УЧАСТНИК КУРСА</span></div>
        <span class="course-profile-arrow">›</span>
      </div>
      <section class="course-hero">
        <div class="course-hero-kicker">МОЙ КУРС</div>
        <div class="course-hero-title">УПРАВЛЕНИЕ<br>ВНИМАНИЕМ</div>
        <div class="course-hero-subtitle">26 уроков · 4 недели + предобучение</div>
        <div class="course-hero-actions">
          <span class="course-hero-count">${done.size} ИЗ ${total}</span>
          <button class="course-hero-continue" onclick="continueCourse()">${done.size?'Продолжить':'Начать обучение'} <span>→</span></button>
        </div>
      </section>
      <div class="course-section-head"><span>▷ МОИ УРОКИ</span><small>26 УРОКОВ · 5 ЭТАПОВ</small></div>`;
    // ----------------------------------------------
    // АДМИНКА
    // ----------------------------------------------

    if (window.isAdmin) {

      html += `

        <button
          class="button"
          onclick="loadAdmin()"
          style="margin-bottom:16px;"
        >
          👨‍💼 Админка
        </button>

      `;

    }


    // ----------------------------------------------
    // НОВОСТИ
    // ----------------------------------------------

    // ----------------------------------------------
    // БЛОКИ
    // ----------------------------------------------

    if (!blocks.length) {

      html += `

        <div class="card">

          <div class="status">
            Блоки курса пока не созданы.
          </div>

        </div>

      `;

    } else {

      blocks.forEach(
        (block, index) => {
          const weekLessons=courseProgress.lessons.filter(l=>l.block_id===block.id);
          const weekDone=weekLessons.filter(l=>done.has(l.id)).length;
          const weekTotal=weekLessons.length||(block.block_number===0?2:6);
          const weekPct=Math.round(100*weekDone/weekTotal);

          html += `

            <div
              class="card block-card"
              onclick="loadLessons(
                '${block.id}',
                '${escapeHtml(
                  block.title
                )}'
              )"
            >

              <div class="week-thumb week-thumb-${block.block_number}" aria-hidden="true"><span class="week-video-placeholder">▶</span></div>
              <div class="week-main"><div class="label">
                ${block.block_number===0?"ПРЕДОБУЧЕНИЕ":"НЕДЕЛЯ "+block.block_number}
              </div>

              <div class="block-title">
                ${escapeHtml(
                  block.title
                )}
              </div>

              <div class="block-info">
                ${weekDone} из ${weekTotal} уроков · ${weekPct}% пройдено
              </div>
              <div role="progressbar" aria-label="Прогресс блока" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${weekPct}" style="height:9px;border-radius:20px;background:#dedede;overflow:hidden;margin:13px 0 8px">
                <div style="height:100%;width:${weekPct}%;background:#e3db25;border-radius:20px;transition:width .25s"></div>
              </div>
              </div><div class="week-open" aria-label="Открыть уроки"><span>→</span></div>

            </div>

          `;

        }
      );

    }


    html += `
      <a href="./course-live.html" style="display:block;background:#181818;color:#fff;padding:20px;border-radius:18px;margin:24px 0;text-decoration:none;border:1px solid #444">
        <div style="color:#f5fa45;font-weight:800;font-size:12px;letter-spacing:1.4px">ДОПОЛНИТЕЛЬНЫЕ МАТЕРИАЛЫ</div>
        <div style="font-size:24px;font-weight:900;margin:8px 0">ПРЯМЫЕ ЭФИРЫ С ЕВГЕНИЕМ</div>
        <div style="color:#aaa">Отдельная библиотека записей · 3 записи</div>
        <div style="color:#f5fa45;margin-top:12px">Открыть раздел →</div>
      </a>`;

    app.innerHTML =
      html;
    // Show the actual opening frame of the first lesson in each block.
    // Signed thumbnails are requested only for the authenticated student.
    const thumbs=blocks.map(block=>({
      block,lesson:courseProgress.lessons.filter(l=>l.block_id===block.id&&l.is_published).sort((a,b)=>a.day_number-b.day_number)[0]
    })).filter(x=>x.lesson);
    await Promise.all(thumbs.map(async ({block,lesson})=>{
      try{
        const result=await courseProgressRequest('course_watch',{lessonId:lesson.id});
        const container=app.querySelector('.week-thumb-'+block.block_number);
        if(!container||!result.token)return;
        // Embed the actual Cloudflare video paused on its opening frame,
        // not an unrelated photo or a generated thumbnail.
        const frame=document.createElement('iframe');
        frame.title='Начало первого видео: '+block.title;
        frame.loading='lazy';
        frame.allow='encrypted-media; picture-in-picture';
        frame.tabIndex=-1;
        frame.setAttribute('aria-hidden','true');
        frame.src='https://'+CLOUDFLARE_CUSTOMER+'/'+encodeURIComponent(result.token)+'/iframe?preload=metadata&controls=false&autoplay=false&muted=true';
        container.replaceChildren(frame);
      }catch(e){console.warn('Lesson thumbnail unavailable',block.block_number,e.message)}
    }));

  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="card">

        <div class="error">

          Не удалось загрузить курс.

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      </div>

    `;

  }

}

async function loadLessons(
  blockId,
  blockTitle
) {
  setCourseBack(()=>loadCourse(),'Уроки недели');

  const app = document.getElementById("app");

  app.innerHTML = `
    <button class="button back-button" onclick="loadCourse()">
      ← Назад к курсу
    </button>

    <div class="card">
      <div class="label">БЛОК</div>
      <div class="lesson-title">${escapeHtml(blockTitle)}</div>
    </div>

    <div class="status">Загружаем уроки...</div>
  `;

  try {
    const data=await courseProgressRequest('course_block_lessons',{blockId});
    const lessons=data.lessons||[];
    const doneIds=new Set(courseProgress.completed);
    const finished=lessons.filter(l=>doneIds.has(l.id)).length;
    const blockMeta=courseProgress.blocks.find(b=>b.id===blockId);
    const blockTotal=blockMeta?.block_number===0?2:6;
    const percent=Math.round(100*finished/blockTotal);


    let html = `
      <button class="button back-button" onclick="loadCourse()">
        ← Назад к курсу
      </button>

      <div class="card">
        <div class="label">БЛОК</div>
        <div class="lesson-title">${escapeHtml(blockTitle)}</div>
        <div style="margin-top:12px;font-weight:700">${finished} из ${blockTotal} уроков · ${percent}% пройдено</div>
        <div role="progressbar" aria-label="Прогресс недели" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}" style="height:10px;border-radius:20px;background:#dedede;overflow:hidden;margin-top:9px"><div style="height:100%;width:${percent}%;background:#e3db25;border-radius:20px"></div></div>
      </div>
    `;

    if (!lessons.length) {
      html += `
        <div class="card">
          <div class="status">Уроки пока не опубликованы.</div>
        </div>
      `;
      app.innerHTML = html;
      return;
    }

    lessons.forEach((lesson, index) => {
      html += `
        <div
          class="card lesson-card"
          onclick="loadLesson(
            '${lesson.id}',
            '${lesson.block_id}',
            '${escapeHtml(blockTitle)}'
          )"
        >
          <div class="lesson-number">УРОК ${index + 1}</div>
          <div class="lesson-name">${escapeHtml(lesson.title)}</div>
        </div>
      `;
    });

    app.innerHTML = html;

  } catch (error) {
    console.error(error);
    app.innerHTML = `
      <div class="card">
        <div class="error">
          Не удалось загрузить уроки.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      </div>
    `;
  }
}

async function loadLesson(
  lessonId,
  blockId,
  blockTitle
) {
  setCourseBack(()=>loadLessons(blockId,blockTitle),'Видео урока');

  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="status">Загружаем урок...</div>
  `;

  try {
    const data=await courseProgressRequest('course_lesson_details',{lessonId});
    const lessons=data.lessons||[];
    if(!lessons.length)throw Error('Урок не найден.');
    const lesson=lessons[0];
    const alreadyDone=courseProgress.completed.includes(lesson.id);
    const currentBlockId = blockId || lesson.block_id;
    let videoHtml = "";
    const completeHtml=`<div class="card" style="border:1px solid #ddd">
      <div style="font-weight:700;margin-bottom:10px">Прогресс урока: ${alreadyDone?'✓ Завершён':'Ещё не завершён'}</div>
      <button id="course-manual-complete" class="button" onclick="markCourseLesson('${lesson.id}',${!alreadyDone},'${currentBlockId}','${escapeHtml(blockTitle)}')">${alreadyDone?'Отменить отметку':'Отметить урок пройденным'}</button>
      <p style="margin-top:10px;font-size:12px;color:#777">Просмотр урока и выполнение упражнения — разные результаты.</p>
    </div>`;


    if (lesson.video_url) {
      const tokenResponse = await fetch('/api/stream-token',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'course_watch',initData:window.Telegram?.WebApp?.initData,lessonId:lesson.id})
      });

      if (!tokenResponse.ok) {
        const errorData=await tokenResponse.json().catch(()=>({}));
        throw new Error(
          "Не удалось получить доступ к видео: " + tokenResponse.status +
          (errorData.error ? " — " + String(errorData.error).slice(0,180) : "")
        );
      }

      const tokenData = await tokenResponse.json();

      if (!tokenData.token) {
        throw new Error("Cloudflare не вернул токен видео.");
      }

      videoHtml = `
        <div class="card">
          <div class="label">🎬 ВИДЕО УРОКА</div>
          <div class="video-wrapper">
            <iframe id="course-video-player"
              src="https://${CLOUDFLARE_CUSTOMER}/${tokenData.token}/iframe"
              allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
              allowfullscreen>
            </iframe>
          </div>
          <p id="course-watch-status" style="font-size:13px;color:#777;margin-top:12px">Просмотри 90% видео — урок завершится автоматически</p>
        </div>
      `;
    }

    app.innerHTML = `
      <button
        class="button back-button"
        onclick="loadLessons(
          '${currentBlockId}',
          '${escapeHtml(blockTitle)}'
        )"
      >
        ← К урокам
      </button>

      <div class="card">
        <div class="label">${escapeHtml(blockTitle)}</div>
        <div class="lesson-title">${escapeHtml(lesson.title)}</div>
        ${lesson.description ? `
          <div class="description">${escapeHtml(lesson.description)}</div>
        ` : ""}
      </div>

      ${videoHtml}

      <div class="card">
        <div class="label">📝 ДОМАШНЕЕ ЗАДАНИЕ</div>
        <div class="homework">${escapeHtml(lesson.homework || "")}</div>
        <button
          class="button"
          onclick="alert('Здесь позже появится отправка выполнения кинологу')"
        >
          📤 Отправить выполнение
        </button>
      </div>

      <div class="card">
        <div class="label">💎 НАГРАДА</div>
        <div style="font-size:22px;font-weight:700;">
          +${lesson.crystal_reward || 0} кристаллов
        </div>
      </div>
      ${completeHtml}
    `;
    if(lesson.video_url)setupAutomaticLessonCompletion(lesson.id,alreadyDone);

  } catch (error) {
    console.error(error);
    app.innerHTML = `
      <button
        class="button back-button"
        onclick="loadLessons(
          '${blockId || ""}',
          '${escapeHtml(blockTitle)}'
        )"
      >
        ← К урокам
      </button>

      <div class="card">
        <div class="error">
          Не удалось загрузить урок.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      </div>
    `;
  }
}

async function createCohort() {

  const nameInput =
    document.getElementById("cohort-name");

  const startInput =
    document.getElementById("cohort-start-date");

  const endInput =
    document.getElementById("cohort-end-date");

  const accessEndInput =
    document.getElementById("cohort-access-end-date");

  const status =
    document.getElementById("cohort-create-status");


  const name =
    nameInput.value.trim();

  const startDate =
    startInput.value;

  const endDate =
    endInput.value;

  const accessEndDate =
    accessEndInput.value;


  if (!name) {
    status.textContent =
      "❌ Укажите название потока";
    status.style.color =
      "#b00020";
    return;
  }


  if (!startDate) {
    status.textContent =
      "❌ Укажите дату начала";
    status.style.color =
      "#b00020";
    return;
  }


  if (!endDate) {
    status.textContent =
      "❌ Укажите дату окончания";
    status.style.color =
      "#b00020";
    return;
  }


  if (!accessEndDate) {
    status.textContent =
      "❌ Укажите дату окончания доступа";
    status.style.color =
      "#b00020";
    return;
  }


  status.textContent =
    "Создаём поток...";

  status.style.color =
    "#777";


  try {

    const response =
      await fetch(
        "/api/admin-cohort-create",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            initData:
              Telegram.WebApp.initData,

            name:
              name,

            startDate:
              startDate,

            endDate:
              endDate,

            accessEndDate:
              accessEndDate

          })
        }
      );


    const data =
      await response
        .json()
        .catch(() => ({}));


    if (!response.ok) {

     throw new Error(
  data.details
    ? data.error + ": " + data.details
    : data.error || "Не удалось создать поток"
);

    }


    status.textContent =
      "✅ Поток успешно создан";

    status.style.color =
      "#16803c";


    nameInput.value = "";
    startInput.value = "";
    endInput.value = "";
    accessEndInput.value = "";


  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ " + error.message;

    status.style.color =
      "#b00020";

  }

}

          ? data.error +
            ": " +
            data.details
          : data.error ||
            "Не удалось загрузить потоки"
      );

    }


    const cohorts =
      data.cohorts || [];


    let html = `

      <button
        class="button back-button"
        onclick="loadAdmin()"
      >
        ← Админка
      </button>

      <div class="card">

        <div class="label">
          📚 ПОТОКИ
        </div>

        <div class="lesson-title">
          Все потоки
        </div>

        <button
          class="button"
          onclick="loadCohortCreate()"
        >
          ➕ Создать поток
        </button>

      </div>

    `;


    if (!cohorts.length) {

      html += `

        <div class="card">

          <div class="status">
            Потоков пока нет.
          </div>

        </div>

      `;

    } else {

      cohorts.forEach(
        cohort => {

          const startDate =
            formatDate(
              cohort.start_date
            );

          const endDate =
            formatDate(
              cohort.end_date
            );

          const accessEndDate =
            formatDate(
              cohort.access_end_date
            );


          html += `

            <div
              class="card"
              style="cursor:pointer;"
              onclick="loadCohort(
                '${cohort.id}'
              )"
            >

              <div class="label">
                📚 ПОТОК
              </div>

              <div class="lesson-title">
                ${escapeHtml(
                  cohort.name
                )}
              </div>

              <div
                class="description"
              >

                <b>Обучение:</b><br>
                ${startDate}
                —
                ${endDate}

                <br><br>

                <b>Доступ до:</b><br>
                ${accessEndDate}

              </div>

              <div
                style="
                  margin-top:14px;
                  font-size:14px;
                  color:#777;
                "
              >
                Открыть поток →
              </div>

            </div>

          `;

        }
      );

    }


    app.innerHTML =
      html;


  } catch (error) {

    console.error(error);

    app.innerHTML = `

      <button
        class="button back-button"
        onclick="loadAdmin()"
      >
        ← Админка
      </button>

      <div class="card">

        <div class="error">

          Не удалось загрузить потоки.

            error.message
          )}

      </div>

  }

}


// ==================================================

// ==================================================

function formatDate(value) {

  if (!value) {
    return "—";
  }

  const parts =
    String(value)
      .split("-");

  if (parts.length !== 3) {
    return String(value);
  }

  return (
    parts[2] +
    "." +
    parts[1] +
    "." +
    parts[0]
  );

}

async function saveCertificateName(
  studentId
) {

  const input =
    document.getElementById(
      "certificate-name-" +
      studentId
    );


  const status =
    document.getElementById(
      "student-save-status-" +
      studentId
    );


  if (!input) {

    return;

  }


  const certificateName =
    input.value.trim();


  status.textContent =
    "Сохраняем...";


  try {

    const response =
      await fetch(
        "/api/admin-student-update",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            initData:
              Telegram.WebApp.initData,

            studentId:
              studentId,

            certificateName:
              certificateName

          })

        }
      );


    const data =
      await response
        .json()
        .catch(() => ({}));


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Не удалось сохранить данные"
      );

    }


    status.textContent =
      "✅ ФИО сохранено";


    status.style.color =
      "#16803c";


  } catch (error) {

    console.error(error);


    status.textContent =
      "❌ " +
      error.message;


    status.style.color =
      "#b00020";

  }

}

// ЭКРАНИРОВАНИЕ HTML
// ==================================================

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
