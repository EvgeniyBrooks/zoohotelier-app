<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>УПРАВЛЕНИЕ ВНИМАНИЕМ</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .header {
      margin-bottom: 24px;
    }

    .brand {
      font-size: 14px;
      color: #777;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.1;
      margin: 0;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .block-card {
      cursor: pointer;
      transition:
        transform 0.15s ease;
    }

    .block-card:active {
      transform: scale(0.98);
    }

    .block-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .block-info {
      font-size: 14px;
      color: #777;
    }

    .lesson-card {
      cursor: pointer;
      margin-bottom: 10px;
    }

    .lesson-number {
      font-size: 13px;
      color: #888;
      margin-bottom: 5px;
    }

    .lesson-name {
      font-size: 17px;
      font-weight: 600;
    }

    .label {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .lesson-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .description,
    .homework {
      font-size: 16px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #111;
      color: white;
      margin-top: 12px;
    }

    .back-button {
      background: #e9e9e9;
      color: #111;
      margin-bottom: 16px;
    }

    .status {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    .error {
      color: #b00020;
      line-height: 1.5;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .news-card {
      cursor: pointer;
    }

    .news-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .news-date {
      font-size: 13px;
      color: #888;
    }

    .news-preview {
      font-size: 15px;
      line-height: 1.45;
      color: #555;
      margin-top: 8px;
    }

    .news-image {
      width: 100%;
      display: block;
      border-radius: 14px;
      margin-bottom: 14px;
    }

  </style>
</head>

<body>

  <div class="app">

    <div class="header">

      <div class="brand">
        Зоохотельер
      </div>

      <h1>
        УПРАВЛЕНИЕ ВНИМАНИЕМ
      </h1>

    </div>

    <div id="app">

      <div class="status">
        Подключаем Telegram...
      </div>

    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://imvtdholjeclyznonpdc.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_djtqwY6GvzRXJUd4auCi_Q_fqSsLxET";

const CLOUDFLARE_CUSTOMER =
  "customer-9y0wom20nneqpu4g.cloudflarestream.com";


let currentUser = null;


// ==================================================
// TELEGRAM АВТОРИЗАЦИЯ
// ==================================================

async function authenticateTelegram() {

  const app =
    document.getElementById("app");

  try {

    if (
      !window.Telegram ||
      !window.Telegram.WebApp
    ) {

      throw new Error(
        "Приложение нужно открыть внутри Telegram."
      );

    }

    const tg =
      window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const initData =
      tg.initData;

    if (!initData) {

      throw new Error(
        "Telegram не передал данные пользователя."
      );

    }

    const response =
      await fetch(
        "/api/telegram-auth",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            initData: initData
          })
        }
      );


    if (!response.ok) {

      const errorData =
        await response
          .json()
          .catch(() => ({}));

      console.error(
        "AUTH ERROR:",
        errorData
      );

      throw new Error(
        errorData.details
          ? JSON.stringify(
              errorData.details
            )
          : (
              errorData.error ||
              "Telegram не удалось подтвердить."
            )
      );

    }


    const data =
      await response.json();


    if (
      !data.ok ||
      !data.user
    ) {

      throw new Error(
        "Пользователь не подтверждён."
      );

    }


   currentUser =
  data.user;

window.isAdmin = Boolean(
  data.admin && data.admin.isAdmin
);


    return data;


  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="card">

        <div class="error">
          ${escapeHtml(
            error.message
          )}
        </div>

      </div>

    `;


    return null;

  }

}


// ==================================================
// ГЛАВНЫЙ ЭКРАН КУРСА
// ==================================================

async function loadCourse() {

  const app =
    document.getElementById("app");


  app.innerHTML = `

    <div class="status">
      Загружаем курс...
    </div>

  `;


  try {

    // ----------------------------------------------
    // БЛОКИ
    // ----------------------------------------------

    const blocksResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/course_blocks" +
        "?select=id,title,block_number" +
        "&order=block_number.asc",
        {
          headers: {

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_PUBLISHABLE_KEY

          }
        }
      );


    if (!blocksResponse.ok) {

      throw new Error(
        "Ошибка загрузки блоков: " +
        blocksResponse.status
      );

    }


    const blocks =
      await blocksResponse.json();


    // ----------------------------------------------
    // НОВОСТИ
    // ----------------------------------------------

    const newsResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/news" +
        "?select=id,title,content,image_url,created_at" +
        "&is_published=eq.true" +
        "&order=created_at.desc" +
        "&limit=5",
        {
          headers: {

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_PUBLISHABLE_KEY

          }
        }
      );


    if (!newsResponse.ok) {

      throw new Error(
        "Ошибка загрузки новостей: " +
        newsResponse.status
      );

    }


    const news =
      await newsResponse.json();


   let html = "";

if (window.isAdmin) {
  html += `
    <button
      class="button"
      onclick="loadAdmin()"
      style="margin-bottom:16px;"
    >
      👨‍💼 Админка
    </button>
  `;
}


    // ----------------------------------------------
    // НОВОСТИ
    // ----------------------------------------------

    html += `

      <div
        class="card news-card"
        onclick="loadNews()"
      >

        <div class="label">
          📰 НОВОСТИ
        </div>

        <div class="news-title">
          Новости и объявления
        </div>

        <div class="news-preview">
          ${
            news.length
              ? "Есть новые сообщения →"
              : "Пока новостей нет →"
          }
        </div>

      </div>

    `;


    // ----------------------------------------------
    // БЛОКИ
    // ----------------------------------------------

    if (!blocks.length) {

      html += `

        <div class="card">

          <div class="status">
            Блоки курса пока не созданы.
          </div>

        </div>

      `;

    } else {

      blocks.forEach(
        (block, index) => {

          html += `

            <div
              class="card block-card"
              onclick="loadLessons(
                '${block.id}',
                '${escapeHtml(
                  block.title
                )}'
              )"
            >

              <div class="label">
                ${index + 1} БЛОК
              </div>

              <div class="block-title">
                ${escapeHtml(
                  block.title
                )}
              </div>

              <div class="block-info">
                Открыть уроки →
              </div>

            </div>

          `;

        }
      );

    }


    app.innerHTML =
      html;


  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="card">

        <div class="error">

          Не удалось загрузить курс.

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      </div>

    `;

  }

}


// ==================================================
// НОВОСТИ
// ==================================================

async function loadNews() {

  const app =
    document.getElementById("app");


  app.innerHTML = `

    <div class="status">
      Загружаем новости...
    </div>

  `;


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/news" +
        "?select=id,title,content,image_url,created_at" +
        "&is_published=eq.true" +
        "&order=created_at.desc",
        {
          headers: {

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_PUBLISHABLE_KEY

          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "Ошибка загрузки новостей: " +
        response.status
      );

    }


    const news =
      await response.json();


    let html = `

      <button
        class="button back-button"
        onclick="loadCourse()"
      >
        ← Назад
      </button>

    `;


    if (!news.length) {

      html += `

        <div class="card">

          <div class="status">
            Новостей пока нет.
          </div>

        </div>

      `;

    } else {

      news.forEach(
        item => {

          const date =
            new Date(
              item.created_at
            ).toLocaleDateString(
              "ru-RU",
              {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
              }
            );


          html += `

            <div class="card">

              <div class="label">
                📰 ${date}
              </div>

              <div class="lesson-title">
                ${escapeHtml(
                  item.title
                )}
              </div>

              ${
                item.image_url
                  ? `
                    <img
                      class="news-image"
                      src="${escapeHtml(
                        item.image_url
                      )}"
                      alt=""
                    >
                  `
                  : ""
              }

              <div class="description">
                ${escapeHtml(
                  item.content
                )}
              </div>

            </div>

          `;

        }
      );

    }


    app.innerHTML =
      html;


  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="card">

        <div class="error">

          Не удалось загрузить новости.

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      </div>

    `;

  }

}


// ==================================================
// УРОКИ БЛОКА
// ==================================================

async function loadLessons(
  blockId,
  blockTitle
) {

  const app =
    document.getElementById("app");


  app.innerHTML = `

    <button
      class="button back-button"
      onclick="loadCourse()"
    >
      ← Назад к курсу
    </button>

    <div class="card">

      <div class="label">
        БЛОК
      </div>

      <div class="lesson-title">
        ${escapeHtml(
          blockTitle
        )}
      </div>

    </div>

    <div class="status">
      Загружаем уроки...
    </div>

  `;


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/lessons" +
        "?select=id,title,day_number,is_published" +
        "&block_id=eq." +
        encodeURIComponent(
          blockId
        ) +
        "&is_published=eq.true" +
        "&order=day_number.asc",
        {
          headers: {

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_PUBLISHABLE_KEY

          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "Ошибка загрузки уроков: " +
        response.status
      );

    }


    const lessons =
      await response.json();


    let html = `

      <button
        class="button back-button"
        onclick="loadCourse()"
      >
        ← Назад к курсу
      </button>

      <div class="card">

        <div class="label">
          БЛОК
        </div>

        <div class="lesson-title">
          ${escapeHtml(
            blockTitle
          )}
        </div>

      </div>

    `;


    if (!lessons.length) {

      html += `

        <div class="card">

          <div class="status">
            Уроки пока не опубликованы.
          </div>

        </div>

      `;

      app.innerHTML =
        html;

      return;

    }


    lessons.forEach(
      (lesson, index) => {

        html += `

          <div
            class="card lesson-card"
            onclick="loadLesson(
              '${lesson.id}',
              '${escapeHtml(
                blockTitle
              )}'
            )"
          >

            <div class="lesson-number">
              УРОК ${index + 1}
            </div>

            <div class="lesson-name">
              ${escapeHtml(
                lesson.title
              )}
            </div>

          </div>

        `;

      }
    );


    app.innerHTML =
      html;


  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="card">

        <div class="error">

          Не удалось загрузить уроки.

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      </div>

    `;

  }

}


// ==================================================
// ОТКРЫТИЕ УРОКА
// ==================================================

async function loadLesson(
  lessonId,
  blockTitle
) {

  const app =
    document.getElementById("app");


  app.innerHTML = `

    <div class="status">
      Загружаем урок...
    </div>

  `;


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/lessons" +
        "?select=id,title,description,homework,crystal_reward,is_published,video_url" +
        "&id=eq." +
        encodeURIComponent(
          lessonId
        ) +
        "&is_published=eq.true" +
        "&limit=1",
        {
          headers: {

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_PUBLISHABLE_KEY

          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "Ошибка Supabase: " +
        response.status
      );

    }


    const lessons =
      await response.json();


    if (!lessons.length) {

      throw new Error(
        "Урок не найден."
      );

    }


    const lesson =
      lessons[0];


    let videoHtml =
      "";


    // ----------------------------------------------
    // ВИДЕО
    // ----------------------------------------------

    if (lesson.video_url) {

      const tokenResponse =
        await fetch(
          "/api/stream-token?videoId=" +
          encodeURIComponent(
            lesson.video_url
          )
        );


      if (!tokenResponse.ok) {

        throw new Error(
          "Не удалось получить доступ к видео: " +
          tokenResponse.status
        );

      }


      const tokenData =
        await tokenResponse.json();


      if (!tokenData.token) {

        throw new Error(
          "Cloudflare не вернул токен видео."
        );

      }


      videoHtml = `

        <div class="card">

          <div class="label">
            🎬 ВИДЕО УРОКА
          </div>

          <div class="video-wrapper">

            <iframe
              src="https://${CLOUDFLARE_CUSTOMER}/${tokenData.token}/iframe"
              allow="
                accelerometer;
                gyroscope;
                autoplay;
                encrypted-media;
                picture-in-picture;
              "
              allowfullscreen>
            </iframe>

          </div>

        </div>

      `;

    }


    // ----------------------------------------------
    // КОНТЕНТ УРОКА
    // ----------------------------------------------

    app.innerHTML = `

      <button
        class="button back-button"
        onclick="loadCourse()"
      >
        ← К курсу
      </button>

      <div class="card">

        <div class="label">
          ${escapeHtml(
            blockTitle
          )}
        </div>

        <div class="lesson-title">
          ${escapeHtml(
            lesson.title
          )}
        </div>

        <div class="description">
          ${escapeHtml(
            lesson.description ||
            ""
          )}
        </div>

      </div>


      ${videoHtml}


      <div class="card">

        <div class="label">
          📝 ДОМАШНЕЕ ЗАДАНИЕ
        </div>

        <div class="homework">
          ${escapeHtml(
            lesson.homework ||
            ""
          )}
        </div>

        <button
          class="button"
          onclick="alert(
            'Здесь позже появится отправка выполнения кинологу'
          )"
        >
          📤 Отправить выполнение
        </button>

      </div>


      <div class="card">

        <div class="label">
          💎 НАГРАДА
        </div>

        <div style="
          font-size:22px;
          font-weight:700;
        ">
          +${lesson.crystal_reward || 0}
          кристаллов
        </div>

      </div>

    `;


  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="card">

        <div class="error">

          Не удалось загрузить урок.

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      </div>

    `;

  }

}


// ==================================================
// ЗАПУСК
// ==================================================

async function startApp() {

  const authResult =
    await authenticateTelegram();


  if (!authResult) {
    return;
  }


  console.log(
    "Telegram user:",
    authResult.user
  );


  console.log(
    "Course access:",
    authResult.access
  );


  // ==================================================
  // АДМИНКА
  // ==================================================

  if (
    authResult.admin &&
    authResult.admin.isAdmin
  ) {

    const app =
      document.getElementById("app");

    app.insertAdjacentHTML(
      "afterbegin",
      `
        <button
          class="button"
          onclick="alert('АДМИНКА')"
          style="margin-bottom:16px;"
        >
          👨‍💼 Админка
        </button>
      `
    );

  }


  // ==================================================
  // ПРОВЕРКА ДОСТУПА К КУРСУ
  // ==================================================

  if (
    !authResult.access ||
    !authResult.access.hasAccess
  ) {

    const app =
      document.getElementById("app");


    app.innerHTML = `

      <div class="card">

        <div class="lesson-title">
          Доступ к обучению не найден
        </div>

        <div class="description">
          У вас пока нет активного доступа
          к курсу «УПРАВЛЕНИЕ ВНИМАНИЕМ».
        </div>

      </div>

    `;


    return;

  }


  await loadCourse();

}


// ==================================================
// ЭКРАНИРОВАНИЕ HTML
// ==================================================

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ==================================================
// START
// ==================================================

startApp();

</script>

</body>
</html>
