// ==================================================

async function authenticateTelegram() {

  const app =
    document.getElementById("app");

  try {

    if (
      !window.Telegram ||
      !window.Telegram.WebApp
    ) {

      throw new Error(
        "Приложение нужно открыть внутри Telegram."
      );

    }


    const tg =
      window.Telegram.WebApp;


    tg.ready();
    tg.expand();


    const initData =
      tg.initData;


    if (!initData) {

      throw new Error(
        "Telegram не передал данные пользователя."
      );

    }


    const response =
      await fetch(
        "/api/telegram-auth",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            initData: initData
          })
        }
      );


    if (!response.ok) {

      const errorData =
        await response
          .json()
          .catch(() => ({}));


      console.error(
        "AUTH ERROR:",
        errorData
      );


      throw new Error(
        errorData.details
          ? JSON.stringify(
              errorData.details
            )
          : (
              errorData.error ||
              "Telegram не удалось подтвердить."
            )
      );

    }


    const data =
      await response.json();


    if (
      !data.ok ||
      !data.user
    ) {

      throw new Error(
        "Пользователь не подтверждён."
      );

    }


    currentUser =
      data.user;


    window.isAdmin =
      Boolean(
        data.admin &&
        data.admin.isAdmin
      );


    return data;


  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="card">

        <div class="error">

          ${escapeHtml(
            error.message
          )}

        </div>

      </div>

    `;


    return null;

  }

}

async function loadCourse() {

  const app =
    document.getElementById("app");


  app.innerHTML = `

    <div class="status">
      Загружаем курс...
    </div>

  `;


  try {


    // ----------------------------------------------
    // БЛОКИ
    // ----------------------------------------------

      await fetch(
        SUPABASE_URL +
        "/rest/v1/course_blocks" +
        "?select=id,title,block_number" +
        "&order=block_number.asc",
        {
          headers: {

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_PUBLISHABLE_KEY

          }
        }
      );


    if (!blocksResponse.ok) {

      throw new Error(
        "Ошибка загрузки блоков: " +
        blocksResponse.status
      );

    }


    const blocks =
      await blocksResponse.json();


    // ----------------------------------------------
    // НОВОСТИ
    // ----------------------------------------------

    const newsResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/news" +
        "?select=id,title,content,image_url,created_at" +
        "&is_published=eq.true" +
        "&order=created_at.desc" +
        "&limit=5",
        {
          headers: {

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_PUBLISHABLE_KEY

          }
        }
      );


    if (!newsResponse.ok) {

      throw new Error(
        "Ошибка загрузки новостей: " +
        newsResponse.status
      );

    }


    const news =
      await newsResponse.json();


    let html = "";


    // ----------------------------------------------
    // АДМИНКА
    // ----------------------------------------------

    if (window.isAdmin) {

      html += `

        <button
          class="button"
          onclick="loadAdmin()"
          style="margin-bottom:16px;"
        >
          👨‍💼 Админка
        </button>

      `;

    }


    // ----------------------------------------------
    // НОВОСТИ
    // ----------------------------------------------

    html += `

      <div
        class="card news-card"
        onclick="loadNews()"
      >

        <div class="label">
          📰 НОВОСТИ
        </div>

        <div class="news-title">
          Новости и объявления

          ${
            news.length
              ? "Есть новые сообщения →"
              : "Пока новостей нет →"
          }

        </div>

    `;


    // ----------------------------------------------
    // БЛОКИ
    // ----------------------------------------------

    if (!blocks.length) {

      html += `

        <div class="card">

          <div class="status">
            Блоки курса пока не созданы.
          </div>

        </div>

      `;

    } else {

      blocks.forEach(
        (block, index) => {

          html += `

            <div
              class="card block-card"
              onclick="loadLessons(
                '${block.id}',
                '${escapeHtml(
                  block.title
                )}'
              )"
            >

              <div class="label">
                ${index + 1} БЛОК
              </div>

              <div class="block-title">
                ${escapeHtml(
                  block.title
                )}
              </div>

              <div class="block-info">
                Открыть уроки →

            </div>

          `;

        }
      );

    }


    app.innerHTML =
      html;


  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="card">

        <div class="error">

          Не удалось загрузить курс.

          <br><br>

          ${escapeHtml(
            error.message
          )}

        </div>

      </div>

    `;

  }

}

async function loadLessons(
  blockId,
  blockTitle
) {

  const app = document.getElementById("app");

  app.innerHTML = `
    <button class="button back-button" onclick="loadCourse()">
      ← Назад к курсу
    </button>

    <div class="card">
      <div class="label">БЛОК</div>
      <div class="lesson-title">${escapeHtml(blockTitle)}</div>
    </div>

    <div class="status">Загружаем уроки...</div>
  `;

  try {
    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/lessons" +
      "?select=id,title,day_number,is_published,block_id" +
      "&block_id=eq." + encodeURIComponent(blockId) +
      "&is_published=eq.true" +
      "&order=day_number.asc",
      {
        headers: {
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization": "Bearer " + SUPABASE_PUBLISHABLE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Ошибка загрузки уроков: " + response.status);
    }

    const lessons = await response.json();

    let html = `
      <button class="button back-button" onclick="loadCourse()">
        ← Назад к курсу
      </button>

      <div class="card">
        <div class="label">БЛОК</div>
        <div class="lesson-title">${escapeHtml(blockTitle)}</div>
      </div>
    `;

    if (!lessons.length) {
      html += `
        <div class="card">
          <div class="status">Уроки пока не опубликованы.</div>
        </div>
      `;
      app.innerHTML = html;
      return;
    }

    lessons.forEach((lesson, index) => {
      html += `
        <div
          class="card lesson-card"
          onclick="loadLesson(
            '${lesson.id}',
            '${lesson.block_id}',
            '${escapeHtml(blockTitle)}'
          )"
        >
          <div class="lesson-number">УРОК ${index + 1}</div>
          <div class="lesson-name">${escapeHtml(lesson.title)}</div>
        </div>
      `;
    });

    app.innerHTML = html;

  } catch (error) {
    console.error(error);
    app.innerHTML = `
      <div class="card">
        <div class="error">
          Не удалось загрузить уроки.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      </div>
    `;
  }
}

async function loadLesson(
  lessonId,
  blockId,
  blockTitle
) {

  const app = document.getElementById("app");

  app.innerHTML = `
    <div class="status">Загружаем урок...</div>
  `;

  try {
    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/lessons" +
      "?select=id,title,description,homework,crystal_reward,is_published,video_url,block_id" +
      "&id=eq." + encodeURIComponent(lessonId) +
      "&is_published=eq.true" +
      "&limit=1",
      {
        headers: {
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization": "Bearer " + SUPABASE_PUBLISHABLE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Ошибка Supabase: " + response.status);
    }

    const lessons = await response.json();

    if (!lessons.length) {
      throw new Error("Урок не найден.");
    }

    const lesson = lessons[0];
    const currentBlockId = blockId || lesson.block_id;
    let videoHtml = "";

    if (lesson.video_url) {
      const tokenResponse = await fetch(
        "/api/stream-token?videoId=" + encodeURIComponent(lesson.video_url)
      );

      if (!tokenResponse.ok) {
        throw new Error(
          "Не удалось получить доступ к видео: " + tokenResponse.status
        );
      }

      const tokenData = await tokenResponse.json();

      if (!tokenData.token) {
        throw new Error("Cloudflare не вернул токен видео.");
      }

      videoHtml = `
        <div class="card">
          <div class="label">🎬 ВИДЕО УРОКА</div>
          <div class="video-wrapper">
            <iframe
              src="https://${CLOUDFLARE_CUSTOMER}/${tokenData.token}/iframe"
              allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
              allowfullscreen>
            </iframe>
          </div>
        </div>
      `;
    }

    app.innerHTML = `
      <button
        class="button back-button"
        onclick="loadLessons(
          '${currentBlockId}',
          '${escapeHtml(blockTitle)}'
        )"
      >
        ← К урокам
      </button>

      <div class="card">
        <div class="label">${escapeHtml(blockTitle)}</div>
        <div class="lesson-title">${escapeHtml(lesson.title)}</div>
        ${lesson.description ? `
          <div class="description">${escapeHtml(lesson.description)}</div>
        ` : ""}
      </div>

      ${videoHtml}

      <div class="card">
        <div class="label">📝 ДОМАШНЕЕ ЗАДАНИЕ</div>
        <div class="homework">${escapeHtml(lesson.homework || "")}</div>
        <button
          class="button"
          onclick="alert('Здесь позже появится отправка выполнения кинологу')"
        >
          📤 Отправить выполнение
        </button>
      </div>

      <div class="card">
        <div class="label">💎 НАГРАДА</div>
        <div style="font-size:22px;font-weight:700;">
          +${lesson.crystal_reward || 0} кристаллов
        </div>
      </div>
    `;

  } catch (error) {
    console.error(error);
    app.innerHTML = `
      <button
        class="button back-button"
        onclick="loadLessons(
          '${blockId || ""}',
          '${escapeHtml(blockTitle)}'
        )"
      >
        ← К урокам
      </button>

      <div class="card">
        <div class="error">
          Не удалось загрузить урок.
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      </div>
    `;
  }
}

async function createCohort() {

  const nameInput =
    document.getElementById("cohort-name");

  const startInput =
    document.getElementById("cohort-start-date");

  const endInput =
    document.getElementById("cohort-end-date");

  const accessEndInput =
    document.getElementById("cohort-access-end-date");

  const status =
    document.getElementById("cohort-create-status");


  const name =
    nameInput.value.trim();

  const startDate =
    startInput.value;

  const endDate =
    endInput.value;

  const accessEndDate =
    accessEndInput.value;


  if (!name) {
    status.textContent =
      "❌ Укажите название потока";
    status.style.color =
      "#b00020";
    return;
  }


  if (!startDate) {
    status.textContent =
      "❌ Укажите дату начала";
    status.style.color =

    status.style.color =
      "#b00020";
    return;
  }


  status.textContent =

  status.style.color =
    "#777";


  try {

    const response =
      await fetch(
        "/api/admin-cohort-create",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            initData:
              Telegram.WebApp.initData,

            name:
              name,

            startDate:
              startDate,

            endDate:
              endDate,

            accessEndDate:
              accessEndDate

          })
        }
      );

      await response
        .json()
        .catch(() => ({}));


    if (!response.ok) {

     throw new Error(
  data.details
    ? data.error + ": " + data.details
    : data.error || "Не удалось создать поток"
);

    }

    status.style.color =
      "#16803c";


    nameInput.value = "";
    startInput.value = "";
    endInput.value = "";
    accessEndInput.value = "";


  } catch (error) {

    console.error(error);

    status.textContent =

// ==================================================

function formatDate(value) {

  if (!value) {
    return "—";
  }

  const parts =
    String(value)
      .split("-");

  if (parts.length !== 3) {
    return String(value);
  }

  return (
    parts[2] +
    "." +
    parts[1] +
    "." +
    parts[0]
  );

}

async function saveCertificateName(
  studentId
) {

  const input =
    document.getElementById(
      "certificate-name-" +
      studentId
    );


  const status =
    document.getElementById(
      "student-save-status-" +
      studentId
    );


  if (!input) {

    return;

  }


  const certificateName =
    input.value.trim();


  status.textContent =
    "Сохраняем...";


  try {

    const response =
      await fetch(
        "/api/admin-student-update",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            initData:
              Telegram.WebApp.initData,

            studentId:
              studentId,

            certificateName:
              certificateName

          })

        }
      );


    const data =
      await response
        .json()
        .catch(() => ({}));


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Не удалось сохранить данные"
      );

    }


    status.textContent =
      "✅ ФИО сохранено";


    status.style.color =
      "#16803c";


  } catch (error) {

    console.error(error);


    status.textContent =
      "❌ " +
      error.message;


    status.style.color =
      "#b00020";

  }

}


// ==================================================
// ЭКРАНИРОВАНИЕ HTML
// ==================================================

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
