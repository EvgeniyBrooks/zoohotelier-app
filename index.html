<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зоохотельер</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px 18px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .card p {
      color: #666;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      background: #111;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">
      Зоохотельер
    </div>

    <div class="subtitle">
      Обучение собак
    </div>

    <div class="card">
      <h2>Управление вниманием 5.0</h2>
      <p>
        Система обучения, которая помогает владельцу
        выстроить понятные отношения с собакой.
      </p>

      <button>
        Перейти к обучению
      </button>
    </div>

    <div class="card">
      <h2>Мои курсы</h2>
      <p>
        Здесь будут отображаться ваши программы обучения,
        уроки и задания.
      </p>
    </div>

  </div>

</body>
</html>
