<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>УПРАВЛЕНИЕ ВНИМАНИЕМ</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .header {
      margin-bottom: 24px;
    }

    .brand {
      font-size: 14px;
      color: #777;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.1;
      margin: 0;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .label {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .lesson-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .description,
    .homework {
      font-size: 16px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #111;
      color: white;
      margin-top: 12px;
    }

    .status {
      text-align: center;
      color: #777;
      padding: 30px 10px;
    }

    .error {
      color: #b00020;
      line-height: 1.5;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="brand">Зоохотельер</div>
    <h1>УПРАВЛЕНИЕ ВНИМАНИЕМ</h1>
  </div>

  <div id="app">
    <div class="status">Подключаем Telegram...</div>
  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://imvtdholjeclyznonpdc.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_djtqwY6GvzRXJUd4auCi_Q_fqSsLxET";

  const CLOUDFLARE_CUSTOMER =
    "customer-9y0wom20nneqpu4g.cloudflarestream.com";


  async function authenticateTelegram() {

    const app = document.getElementById("app");

    try {

      if (!window.Telegram || !window.Telegram.WebApp) {

        throw new Error(
          "Приложение нужно открыть внутри Telegram."
        );

      }

      const tg = window.Telegram.WebApp;

      tg.ready();
      tg.expand();

      const initData = tg.initData;

      if (!initData) {

        throw new Error(
          "Telegram не передал данные пользователя. Открой приложение через Telegram."
        );

      }


      const response = await fetch(
        "/api/telegram-auth",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            initData: initData
          })
        }
      );


     if (!response.ok) {

  const errorData = await response.json()
    .catch(() => ({}));

  console.error("AUTH ERROR:", errorData);

  throw new Error(
    errorData.details
      ? JSON.stringify(errorData.details)
      : (
          errorData.error ||
          "Telegram не удалось подтвердить."
        )
  );
}


      const data = await response.json();


      if (!data.ok || !data.user) {

        throw new Error(
          "Пользователь не подтверждён."
        );

      }


      return data.user;


    } catch (error) {

      console.error(error);

      app.innerHTML = `
        <div class="card">

          <div class="error">
            ${escapeHtml(error.message)}
          </div>

        </div>
      `;

      return null;
    }
  }



  async function loadLesson(user) {

    const app = document.getElementById("app");

    try {

      app.innerHTML = `
        <div class="status">
          Загружаем урок...
        </div>
      `;


      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/lessons" +
        "?select=title,description,homework,crystal_reward,is_published,video_url" +
        "&block_id=eq.8b15fa47-7e16-4796-82c3-f648e5a79486" +
        "&is_published=eq.true" +
        "&limit=1",
        {
          headers: {
            "apikey": SUPABASE_PUBLISHABLE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_PUBLISHABLE_KEY
          }
        }
      );


      if (!response.ok) {

        throw new Error(
          "Ошибка Supabase: " + response.status
        );

      }


      const lessons = await response.json();


      if (!lessons.length) {

        app.innerHTML = `
          <div class="card">
            <div class="error">
              Урок не найден.
            </div>
          </div>
        `;

        return;
      }


      const lesson = lessons[0];


      let videoHtml = "";


      if (lesson.video_url) {

        const tokenResponse = await fetch(
          "/api/stream-token?videoId=" +
          encodeURIComponent(lesson.video_url)
        );


        if (!tokenResponse.ok) {

          throw new Error(
            "Не удалось получить доступ к видео: " +
            tokenResponse.status
          );

        }


        const tokenData =
          await tokenResponse.json();


        if (!tokenData.token) {

          throw new Error(
            "Cloudflare не вернул токен видео"
          );

        }


        videoHtml = `
          <div class="card">

            <div class="label">
              🎬 ВИДЕО УРОКА
            </div>

            <div class="video-wrapper">

              <iframe
                src="https://${CLOUDFLARE_CUSTOMER}/${tokenData.token}/iframe"
                allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
                allowfullscreen>
              </iframe>

            </div>

          </div>
        `;
      }


      app.innerHTML = `

        ${videoHtml}

        <div class="card">

          <div class="label">
            ПРЕДОБУЧЕНИЕ · НЕДЕЛЯ 1
          </div>

          <div class="lesson-title">
            ${escapeHtml(lesson.title)}
          </div>

          <div class="description">
            ${escapeHtml(
              lesson.description || ""
            )}
          </div>

        </div>


        <div class="card">

          <div class="label">
            📝 ДОМАШНЕЕ ЗАДАНИЕ
          </div>

          <div class="homework">
            ${escapeHtml(
              lesson.homework || ""
            )}
          </div>

          <button
            class="button"
            onclick="alert('Здесь позже появится отправка выполнения кинологу')"
          >
            📤 Отправить выполнение
          </button>

        </div>


        <div class="card">

          <div class="label">
            💎 НАГРАДА
          </div>

          <div style="
            font-size:22px;
            font-weight:700;
          ">
            +${lesson.crystal_reward} кристаллов
          </div>

        </div>

      `;


    } catch (error) {

      console.error(error);

      app.innerHTML = `
        <div class="card">

          <div class="error">
            Не удалось загрузить урок.
            <br><br>
            ${escapeHtml(error.message)}
          </div>

        </div>
      `;

    }
  }



  function escapeHtml(value) {

    return String(value)

      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }



  async function startApp() {

    const user = await authenticateTelegram();

    if (!user) {
      return;
    }

    console.log(
      "Telegram user:",
      user
    );

    await loadLesson(user);

  }



  startApp();

</script>

</body>
</html>
